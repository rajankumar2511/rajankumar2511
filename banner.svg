<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070b"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGlass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <circle cx="140" cy="60" r="180" fill="url(#glow1)"/>
  <circle cx="1080" cy="270" r="200" fill="url(#glow2)"/>

  <!-- node network dots -->
  <g stroke="#22d3ee" stroke-opacity="0.18" stroke-width="1">
    <line x1="60" y1="40" x2="180" y2="90"/>
    <line x1="180" y1="90" x2="120" y2="160"/>
    <line x1="1000" y1="60" x2="1100" y2="120"/>
    <line x1="1100" y1="120" x2="1040" y2="200"/>
    <line x1="1140" y1="40" x2="1000" y2="60"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="60" cy="40" r="2.5"/>
    <circle cx="180" cy="90" r="2"/>
    <circle cx="120" cy="160" r="2"/>
    <circle cx="1000" cy="60" r="2"/>
    <circle cx="1100" cy="120" r="2.5"/>
    <circle cx="1040" cy="200" r="2"/>
    <circle cx="1140" cy="40" r="2"/>
  </g>

  <!-- wireframe shapes echoing the hero background -->
  <g fill="none" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.2">
    <polygon points="1090,230 1120,210 1150,230 1140,260 1100,260"/>
  </g>
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.2">
    <rect x="70" y="220" width="34" height="34" transform="rotate(18 87 237)"/>
  </g>

  <!-- eyebrow -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#22d3ee" letter-spacing="2">
    <line x1="80" y1="108" x2="112" y2="108" stroke="#22d3ee" stroke-width="1"/>
    <text x="122" y="112">JALANDHAR, PUNJAB, INDIA</text>
  </g>

  <!-- name -->
  <text x="78" y="185" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">Rajan Kumar</text>

  <!-- title -->
  <text x="80" y="222" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#8b95a8">Backend-Focused Software Engineer</text>

  <!-- divider line -->
  <rect x="80" y="248" width="1040" height="1" fill="url(#lineGrad)"/>

  <!-- footer tags -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#5b6478" letter-spacing="1">
    <text x="80" y="278">DISTRIBUTED SYSTEMS</text>
    <text x="290" y="278">REAL-TIME PLATFORMS</text>
    <text x="500" y="278">SYSTEM DESIGN</text>
  </g>
</svg>
